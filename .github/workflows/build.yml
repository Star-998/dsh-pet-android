name: build-apk-agent

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # 不用 android-actions/setup-android：它会去装一个已从仓库下架的旧包 `tools`，
      # 在新版 runner 上必然报 "Failed to find package 'tools'"。
      # ubuntu-latest 镜像本身已经带了 Android SDK 和 cmdline-tools，直接用即可。
      - name: 准备 Android SDK 组件
        run: |
          set -e
          SDK="$ANDROID_SDK_ROOT"
          echo "SDK 目录: $SDK"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SM" ]; then
            echo "镜像里没有 cmdline-tools，手动下载一份"
            mkdir -p "$SDK/cmdline-tools"
            cd /tmp
            curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdtools.zip
            rm -rf "$SDK/cmdline-tools/latest"
            mv cmdline-tools "$SDK/cmdline-tools/latest"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "使用 sdkmanager: $SM"
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$SDK" > "$GITHUB_WORKSPACE/local.properties"

      - name: 还原素材（从上游 dsh-pet 转码）
        run: |
          sudo ln -sf "$(which ffmpeg)" /usr/local/bin/ffmpeg
          chmod +x tools/fetch-and-transcode.sh
          ./tools/fetch-and-transcode.sh
        env:
          # 300p / 15fps：APK 约 80MB，转码最快。想要更清晰可改成 WIDTH=480（约 277MB）
          WIDTH: 300
          QUALITY: 50
          FPS: 15

      # 原仓库 .gitignore 明确排除了第三方版权素材（鲸鱼娘立绘 + 点击音效），
      # 所以任何新克隆的仓库都缺这 4 个资源，编译必然失败。
      # 这里在 CI 里就地生成占位文件：能编译通过，运行不受影响。
      - name: 补生成仓库未分发的素材占位
        run: |
          set -u
          mkdir -p app/src/main/res/drawable app/src/main/res/raw
          printf '%s' '<?xml version="1.0" encoding="utf-8"?><shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><gradient android:type="radial" android:gradientRadius="60%" android:startColor="#334E6BFF" android:centerColor="#1F4E6BFF" android:endColor="#00000000"/></shape>' > app/src/main/res/drawable/whale_selfie.xml
          printf '%s' '<?xml version="1.0" encoding="utf-8"?><shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><gradient android:angle="135" android:startColor="#6BB6FF" android:endColor="#7A6BFF"/></shape>' > app/src/main/res/drawable/whale_cutout.xml
          for n in tap_press tap_release; do
            f="app/src/main/res/raw/$n.mp3"
            ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=880:duration=0.03" -ac 1 -ar 44100 "$f" \
              || printf '\xff\xfb\x90\x64' > "$f"
          done
          ls -l app/src/main/res/raw app/src/main/res/drawable

      - name: 构建 debug APK
        run: |
          chmod +x ./gradlew || true
          sh ./gradlew :app:assembleDebug --no-daemon

      - name: 上传 APK（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: dapet-agent-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 发布到 Releases（手机可直接下载）
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./大肥鱼-Agent.apk
          gh release create "agent-${{ github.run_number }}" ./大肥鱼-Agent.apk \
            --title "大肥鱼桌宠 · AI Agent #${{ github.run_number }}" \
            --notes "自动构建。安装后：1) 系统设置 → 无障碍 → 打开「大肥鱼助手」；2) 桌面「大肥鱼助手」图标 → 右上角 ⚙️ 填 DeepSeek API Key；3) 长按桌宠弹对话框，说一句话就能让她操作手机。" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
