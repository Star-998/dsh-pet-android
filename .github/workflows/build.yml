        run: |
          set -e
          mkdir -p "$HOME/.android" /tmp
          printf '%s' "$KS_B64" | base64 -d > /tmp/dsh.keystore
          cp /tmp/dsh.keystore "$HOME/.android/debug.keystore"
          keytool -list -keystore /tmp/dsh.keystore -storepass android | grep -i androiddebugkey

      - name: 在 build.gradle.kts 里显式指定签名
        run: |
          python3 - <<'PY'
          import re
          p = 'app/build.gradle.kts'
          s = open(p, encoding='utf-8').read()
          if '/tmp/dsh.keystore' not in s:
              inject = """
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("/tmp/dsh.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
          """
              m = re.search(r'^android\s*\{', s, flags=re.M)
              if not m:
                  raise SystemExit('找不到 android { 块')
              j = s.index('\n', m.start()) + 1
              s = s[:j] + inject + s[j:]
              open(p, 'w', encoding='utf-8').write(s)
              print('已注入 signingConfigs')
          else:
              print('已存在，跳过')
          PY
          grep -n "dsh.keystore" app/build.gradle.kts

      - name: 构建 debug APK
        run: |
          chmod +x ./gradlew || true
          sh ./gradlew :app:assembleDebug --no-daemon

      - name: 打印签名指纹（两次构建一致才能覆盖安装）
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" || true
          else
            echo "没有 apksigner，改用 keytool"
            keytool -printcert -jarfile "$APK" || true
          fi

      - name: 上传 APK（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: dapet-agent-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 发布到 Releases（手机可直接下载）
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./大肥鱼-Agent.apk
          gh release create "agent-${{ github.run_number }}" ./大肥鱼-Agent.apk \
            --title "大肥鱼桌宠 · AI Agent #${{ github.run_number }}" \
            --notes "自动构建。安装后：1) 系统设置 → 无障碍 → 打开「大肥鱼助手」；2) 桌面「大肥鱼助手」图标 → 右上角 ⚙️ 填 DeepSeek API Key；3) 长按桌宠弹对话框，说一句话就能让她操作手机。" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
